@font-face { font-family: 'Nunito'; src: url('assets/fonts/Nunito.ttf') format('truetype'); font-weight: 200 1000; font-display: block; }
:root { --night: #140c2e; --ink: #2a1f5e; --cream: #fff8ee; --gold: #ffc94a; --toolbar-height: calc(48px + env(safe-area-inset-top, 0px)); color-scheme: dark; }
