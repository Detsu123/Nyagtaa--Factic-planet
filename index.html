<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Нягтаа: Факт гаригийн аян</title>
<meta name="theme-color" content="#140c2e">
<style>
@font-face { font-family: 'Nunito'; src: url('assets/fonts/Nunito.ttf') format('truetype'); font-weight: 200 1000; font-display: block; }
:root { --night: #140c2e; --ink: #2a1f5e; --cream: #fff8ee; --gold: #ffc94a; color-scheme: dark; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Nunito', 'Trebuchet MS', sans-serif; }
#game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#game canvas { display: block; }
#vid { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 20; }
#vid video { width: 100%; height: 100%; object-fit: contain; background: #000; }
#vid button { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); font: 900 18px 'Nunito', sans-serif; color: var(--ink); background: var(--cream);
  border: 4px solid var(--ink); border-radius: 16px; padding: 10px 20px 10px 22px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; opacity: 0; transition: opacity .4s; }
#vid button.on { opacity: .92; }
#vid button:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
#vid .tap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--cream); font: 900 28px 'Nunito', sans-serif; background: rgba(10,6,25,.6); cursor: pointer; }
#rotate { position: fixed; inset: 0; z-index: 40; background: var(--night); color: var(--cream); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 24px; font: 800 22px/1.35 'Nunito', sans-serif; }
#rotate .phone { width: 64px; height: 108px; border: 6px solid var(--gold); border-radius: 14px; animation: turn 2.2s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #b9a4ff; font: 800 20px 'Nunito', sans-serif; z-index: 1; }
@media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
</style>
<div id="boot">Ачаалж байна…</div>
<div id="game"></div>
<div id="vid" hidden><video id="vv" playsinline webkit-playsinline preload="auto"></video><button id="skip" type="button">Алгасах ▸▸</button></div>
<div id="rotate"><div class="phone"></div><div>Утсаа хэвтээ болгоод тоглоорой</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/scenes_menu.js"></script>
<script src="js/scenes_village.js"></script>
<script src="js/scenes_investigate.js"></script>
<script src="js/scenes_end.js"></script>
<script src="js/main.js"></script>

</head></html>
